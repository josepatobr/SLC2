{% extends "base.html" %}
{% load static %}

{% block content %}
<br><br><br>
    <div>
        <h1 class="title">SLC2</h1>
        <p class="description">Bem vindo ao site SLC2, para comerçamos, que tal criar uma conta?</p>
    </div>

    <div class="father-pag-singup">

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>
                        {{ message }}
                    </li>
                {% endfor %}
            </ul>
        {% endif %}

    
        <form class="form-sing-up" id="id-sing-up">
            <h1 class="titulo-form"> Cadastro</h1>
            <div class="inputs">
                <input type="text" placeholder="Digite seu nome" class="camp-inputs" id="input-name">
                <input type="email" placeholder="Digite seu e-mail" class="camp-inputs" id="input-email">
                <input type="password" placeholder="Digite sua senha" class="camp-inputs" id="input-password">
            </div>
            <button type="submit" id="submit-form-sing-up">SingUp</button>
            <br>
            <a href="{% url 'login' %}">ja possui uma conta?</a>

            
        </form>
    </div>    
{% endblock %}

<script>
    const $ = (elemento) => document.querySelector(elemento);

    $("#id-sing-up").addEventListener("submit", (ev) => {
        ev.preventDefault();

        const nome = $("#input-name").value.trim();
        const email = $("#input-email").value.trim();
        const senha = $("#input-password").value;

        const everything_filled = nome !== "" && email !== "" && senha !== "";

        if (!everything_filled) {
            alert("Preencha todos os campos antes de enviar.");
            return;
        }

        if (nome.length <= 3 || senha.length <= 3) {
            alert("O nome ou senha precisa ter mais de 3 letras.");
            return;
        }

        const registered_User = {
            nome,
            email,
            senha,
        };

        localStorage.setItem("Users", JSON.stringify(registered_User));

        alert("Cadastro realizado com sucesso!");
        window.location.href = "./login.html";
    });
</script>
</html>
